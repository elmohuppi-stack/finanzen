services:
  db:
    image: postgres:16-alpine
    container_name: finanzen-db
    environment:
      POSTGRES_DB: finanzen
      POSTGRES_USER: finanzen
      POSTGRES_PASSWORD: finanzen
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: finanzen-mailpit
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  postgres-data:
